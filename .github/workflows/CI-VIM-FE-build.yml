name: VI FE CI Pipeline

on:
  push:
    paths:
      - 'VIM-FE/**'

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./VIM-FE

    steps:

    - name: GitHub Login
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.KEY }}
        script: |
          console.log(`Authenticated as ${context.actor}`)

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.KEY }}
        fetch-depth: 0
        persist-credentials: true

    - name: Install Dependencies
      run: npm ci

    - name: Build with NPM
      run: ng build --base-href=/VI/
    
    - name: Rename dist to VI
      run: mv dist VI

    - name: Upload VI folder as artifact
      uses: actions/upload-artifact@v4
      with:
        name: VI-artifact
        path: VI/
