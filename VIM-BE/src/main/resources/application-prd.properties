spring.datasource.password=Allahone1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# PRD: schema from dumps/migrations only — do not use update (avoids DDL row-size failures)
spring.jpa.hibernate.ddl-auto=none

# Deployed as velocity.war on Tomcat → public context is already /velocity.
# Spring must use / here to avoid /velocity/velocity. For standalone JAR only, use /velocity instead.
