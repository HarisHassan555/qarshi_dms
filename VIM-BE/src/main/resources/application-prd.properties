spring.main.allow-bean-definition-overriding=true
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=18000000
spring.datasource.hikari.keepaliveTime=300000
logging.level.org.springframework.web=DEBUG
logging.level.com.fasterxml.jackson=DEBUG
logging.level.com.bezkoder=DEBUG

# Spring Boot application logging to file (Windows Server + Tomcat on E:)
logging.file.name=E:/apache-tomcat-8.5.37/logs/velocity-spring.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Logging Levels Configuration
# Root level - catch everything not matched by more specific rules
logging.level.root=WARN

# Your app code - show DEBUG details to diagnose issues
logging.level.com.bezkoder=DEBUG

# Spring Framework - show only INFO to reduce noise
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

# Jackson/Serialization - show only WARN to reduce noise
logging.level.com.fasterxml.jackson=WARN

# Hibernate/JPA - show only INFO
logging.level.org.hibernate=INFO

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB
spring.servlet.multipart.file-size-threshold=2KB

# Application base URL for frontend links (change host/port/scheme to your public PRD URL)
app.base.url=http://172.16.210.135:8080/velocity
# Backend base URL for email action links/signature images
