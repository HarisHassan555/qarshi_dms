# Use when deploying the WAR to external Tomcat with context path /velocity
# (velocity.war or conf/Catalina/localhost/velocity.xml).
# Tomcat already mounts the app at /velocity — do not add a second /velocity here.
#
# IntelliJ / Smart Tomcat VM options:
#   -Dspring.profiles.active=external-tomcat
#
# API base: http://localhost:8080/velocity/
server.servlet.context-path=

# Tomcat provides JSR-356 WebSocket; do not register ServletServerContainerFactoryBean (breaks startup).
app.chat.websocket.servlet-container=false
