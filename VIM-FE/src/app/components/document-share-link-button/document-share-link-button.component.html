<button type="button" [class]="buttonClass" [disabled]="!canShare" (click)="openModal()">
    <icon-share class="inline h-4 w-4" />
    Share link
</button>

<div
    *ngIf="showModal"
    class="fixed inset-0 z-[1200] flex items-center justify-center bg-black/50 p-4"
    (click)="closeModal()">
    <div class="document-share-modal w-full max-w-lg rounded-2xl bg-white shadow-2xl" (click)="$event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
            <h3 class="text-base font-bold text-slate-900">Share view-only link</h3>
            <button type="button" class="text-slate-500 hover:text-red-500" (click)="closeModal()" aria-label="Close">×</button>
        </div>
        <div class="space-y-4 p-5 text-sm text-slate-600">
            <p>
                Anyone with this link can <strong>view the PDF</strong> without logging in. They cannot approve, edit, or download workflow actions.
            </p>
            <label class="block">
                <span class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Link expires in (days)</span>
                <select class="form-select" [(ngModel)]="expiresInDays" [disabled]="isWorking">
                    <option [ngValue]="7">7 days</option>
                    <option [ngValue]="30">30 days</option>
                    <option [ngValue]="90">90 days</option>
                </select>
            </label>

            <div class="flex flex-wrap gap-2">
                <button type="button" class="btn btn-primary" [disabled]="isWorking" (click)="createLink()">
                    {{ isWorking ? 'Creating…' : shareUrl ? 'Create new link' : 'Generate link' }}
                </button>
                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    [disabled]="isWorking || !shareUrl"
                    (click)="copyLink()">
                    Copy link
                </button>
            </div>

            <div *ngIf="shareUrl" class="rounded-lg border border-slate-200 bg-slate-50 p-3">
                <div class="mb-1 text-xs font-semibold text-slate-500">Share URL</div>
                <input class="form-input text-xs" [value]="shareUrl" readonly />
                <p *ngIf="expiresAt" class="mt-2 text-xs text-slate-500">Expires: {{ expiresAt | date: 'medium' }}</p>
            </div>

            <div *ngIf="shareUrl" class="document-share-channels">
                <div class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500">Share via</div>
                <div class="grid grid-cols-4 gap-3 sm:grid-cols-4">
                    <button
                        type="button"
                        *ngFor="let channel of shareChannels"
                        class="document-share-channel-btn"
                        [attr.aria-label]="'Share on ' + channel.label"
                        [disabled]="isWorking"
                        (click)="onShareChannel(channel)">
                        <span
                            class="document-share-channel-icon-wrap"
                            [style.--channel-accent]="channel.accent || '#64748b'">
                            <img
                                class="document-share-channel-icon"
                                [src]="channelIconUrl(channel)"
                                [alt]="channel.label"
                                width="28"
                                height="28"
                                loading="lazy"
                                decoding="async"
                                referrerpolicy="no-referrer"
                                (error)="onShareChannelIconError(channel)" />
                        </span>
                        <span class="document-share-channel-label">{{ channel.label }}</span>
                    </button>
                </div>
            </div>

            <div *ngIf="showInAppPicker && shareUrl" class="rounded-xl border border-rose-100 bg-rose-50/50 p-3">
                <div class="mb-2 flex items-center justify-between gap-2">
                    <span class="text-xs font-semibold uppercase tracking-wide text-rose-800">Velocity — send to colleague</span>
                    <button type="button" class="text-xs text-slate-500 hover:text-slate-800" (click)="showInAppPicker = false">
                        Hide
                    </button>
                </div>
                <input
                    type="search"
                    class="form-input mb-2 text-sm"
                    placeholder="Search by name or login…"
                    [(ngModel)]="inAppUserSearch"
                    [disabled]="loadingInAppUsers" />
                <div *ngIf="loadingInAppUsers" class="py-4 text-center text-xs text-slate-500">Loading users…</div>
                <ul *ngIf="!loadingInAppUsers" class="document-share-user-list max-h-48 space-y-1 overflow-y-auto">
                    <li *ngFor="let user of filteredInAppUsers">
                        <button
                            type="button"
                            class="document-share-user-row"
                            [disabled]="sendingInAppUserId !== null"
                            (click)="sendInApp(user)">
                            <span class="document-share-user-avatar">{{ userInitial(user.displayName) }}</span>
                            <span class="min-w-0 flex-1 text-left">
                                <span class="block truncate text-sm font-medium text-slate-900">{{ user.displayName }}</span>
                                <span class="block truncate text-xs text-slate-500">{{ user.loginName || user.organizationName }}</span>
                            </span>
                            <span *ngIf="sendingInAppUserId === user.userId" class="text-xs text-primary">Sending…</span>
                        </button>
                    </li>
                    <li *ngIf="filteredInAppUsers.length === 0" class="py-3 text-center text-xs text-slate-500">No users found.</li>
                </ul>
            </div>
        </div>
        <div class="flex justify-end border-t border-slate-200 px-5 py-4">
            <button type="button" class="btn btn-outline-secondary" (click)="closeModal()">Close</button>
        </div>
    </div>
</div>
