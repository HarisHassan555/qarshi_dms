<div>
  <div class="panel border-[#e0e6ed] px-0 pb-1.5 dark:border-[#1b2e4b]">
    <div class="mb-4.5 flex flex-col gap-5 px-5 md:flex-row md:items-center">
      <div class="flex items-center gap-2">
        <h5 class="text-xl font-bold dark:text-white-light">Menu List</h5>
      </div>
      <div class="ltr:ml-auto rtl:mr-auto">
        <input [(ngModel)]="search" type="text" class="form-input" placeholder="Search..." />
      </div>
    </div>

    <div class="datatable invoice-table px-5 pb-5">
      <ng-datatable
        [rows]="menus"
        [columns]="cols"
        [sortable]="true"
        [search]="search"
        skin="whitespace-nowrap bh-table-hover"
      >
        <ng-template slot="blnStatus" let-value="data">
          <span class="badge" [ngClass]="[value.blnStatus ? 'badge-outline-success' : 'badge-outline-danger']">
            {{ value.blnStatus ? 'Active' : 'Inactive' }}
          </span>
        </ng-template>

        <ng-template slot="blIsActive" let-value="data">
          <span class="badge" [ngClass]="[value.blIsActive ? 'badge-outline-success' : 'badge-outline-danger']">
            {{ value.blIsActive ? 'Yes' : 'No' }}
          </span>
        </ng-template>

        <ng-template slot="actions" let-value="data">
          <div class="flex items-center justify-center gap-4">
            <a (click)="edit(value)" class="hover:text-info">
              <icon-edit class="h-4.5 w-4.5"></icon-edit>
            </a>
          </div>
        </ng-template>
      </ng-datatable>
    </div>
  </div>
</div>

<modal #modal>
  <ng-template #modalHeader>
    <div>Edit Menu</div>
  </ng-template>
  <ng-template #modalBody>
    <form class="space-y-5" [formGroup]="menuForm" novalidate>
      <div>
        <label for="txtMenuName">Menu Name</label>
        <input id="txtMenuName" type="text" class="form-input" formControlName="txtMenuName" />
        <ng-container *ngIf="isSubmit && menuForm.controls['txtMenuName'].invalid">
          <p class="mt-1 text-danger">Menu Name is required</p>
        </ng-container>
      </div>
      <div>
        <label for="txtMenuIcons">Icon</label>
        <input id="txtMenuIcons" type="text" class="form-input" formControlName="txtMenuIcons" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" class="form-checkbox" [(ngModel)]="blnStatus" [ngModelOptions]="{standalone: true}" />
          <span>Status Active</span>
        </label>
        <label class="inline-flex items-center gap-2">
          <input type="checkbox" class="form-checkbox" [(ngModel)]="blIsActive" [ngModelOptions]="{standalone: true}" />
          <span>Is Active</span>
        </label>
      </div>
    </form>
  </ng-template>
  <ng-template #modalFooter>
    <button type="button" (click)="modal.close()" class="btn btn-outline-danger">Close</button>
    <button type="button" (click)="submit()" class="btn btn-primary ltr:ml-4 rtl:mr-4">Save</button>
  </ng-template>
</modal>
