<div>
    <div class="panel border-[#e0e6ed] px-0 pb-1.5 dark:border-[#1b2e4b]">
        <div class="mb-4.5 flex flex-col gap-5 px-5 md:flex-row md:items-center">
            <div class="flex items-center gap-2" data-tour="activitylogs-header">
                <h5 class="text-xl font-bold dark:text-white-light">Activity Logs</h5>
            </div>
            <div class="ltr:ml-auto rtl:mr-auto flex flex-wrap gap-2 items-center" data-tour="activitylogs-search">
                <input [(ngModel)]="search" type="text" class="form-input w-48" placeholder="Search..." />
            </div>
        </div>

        <div class="mb-4 px-5 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-3" data-tour="activitylogs-filters">
            <div>
                <label class="text-xs text-gray-500">Action</label>
                <select class="form-select" [(ngModel)]="filterActionType">
                    <option *ngFor="let opt of actionTypes" [value]="opt.value">{{ opt.label }}</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-500">Status</label>
                <select class="form-select" [(ngModel)]="filterStatus">
                    <option *ngFor="let opt of statusOptions" [value]="opt.value">{{ opt.label }}</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-500">User ID</label>
                <input type="number" class="form-input" [(ngModel)]="filterUserId" placeholder="User ID" />
            </div>
            <div>
                <label class="text-xs text-gray-500">Entity ID</label>
                <input type="number" class="form-input" [(ngModel)]="filterEntityId" placeholder="App ID" />
            </div>
            <div>
                <label class="text-xs text-gray-500">From</label>
                <input type="date" class="form-input" [(ngModel)]="filterStartDate" />
            </div>
            <div>
                <label class="text-xs text-gray-500">To</label>
                <input type="date" class="form-input" [(ngModel)]="filterEndDate" />
            </div>
        </div>

        <div class="mb-4 px-5 flex gap-2" data-tour="activitylogs-filter-actions">
            <button type="button" class="btn btn-primary" (click)="loadLogs()">Apply Filters</button>
            <button type="button" class="btn btn-outline-secondary" (click)="clearFilters()">Clear</button>
        </div>

        <div class="datatable invoice-table" data-tour="activitylogs-grid">
            <ng-datatable #datatable [rows]="logs" [columns]="cols" [sortable]="true" [search]="search"
                skin="whitespace-nowrap bh-table-hover"
                firstArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M13 19L7 12L13 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M16.9998 19L10.9998 12L16.9998 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                lastArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M11 19L17 12L11 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M6.99976 19L12.9998 12L6.99976 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg> '
                previousArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M15 5L9 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                nextArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'>

                <ng-template slot="txtActionType" let-value="data">
                    <span class="badge badge-outline-primary">{{ value.txtActionType }}</span>
                </ng-template>

                <ng-template slot="txtDevice" let-value="data">
                    <span [title]="value.txtDevice">{{ value.txtDeviceShort || value.txtDevice || '--' }}</span>
                </ng-template>

                <ng-template slot="txtStatus" let-value="data">
                    <span class="badge"
                        [ngClass]="[value.txtStatus === 'SUCCESS' ? 'badge-outline-success' : 'badge-outline-danger']">
                        {{ value.txtStatus }}
                    </span>
                </ng-template>

                <ng-template slot="dteCreatedDate" let-value="data">
                    {{ value.dteCreatedDate | date:'medium' }}
                </ng-template>

                <ng-template slot="txtMessage" let-value="data">
                    <span [title]="value.txtMessage">{{ (value.txtMessage || '') | slice:0:60 }}{{ (value.txtMessage?.length || 0) > 60 ? '...' : '' }}</span>
                </ng-template>
            </ng-datatable>
        </div>
    </div>
</div>
