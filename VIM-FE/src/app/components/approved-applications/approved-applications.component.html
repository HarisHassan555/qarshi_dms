<div class="panel">
    <div class="mb-5 flex flex-col gap-5 md:flex-row md:items-center">
        <h5 class="text-lg font-semibold dark:text-white-light">Approved Applications</h5>
        <div class="ltr:ml-auto rtl:mr-auto">
            <input [(ngModel)]="search" type="text" class="form-input w-auto" placeholder="Search..." />
        </div>
    </div>

    <div class="datatable">
        <ng-datatable [rows]="getDisplayedApplications()" [columns]="cols" [search]="search" [loading]="loading"
            skin="whitespace-nowrap table-hover" firstArrow='<i class="p-i-double-left-arrow"></i>'
            lastArrow='<i class="p-i-double-right-arrow"></i>' previousArrow='<i class="p-i-left-arrow"></i>'
            nextArrow='<i class="p-i-right-arrow"></i>'>

            <ng-template slot="txtFormCode" let-value="data">
                <span class="font-semibold text-primary">#{{ value.txtFormCode }}</span>
            </ng-template>

            <ng-template slot="formName" let-value="data">
                <span class="font-medium">{{ value.formName }}</span>
            </ng-template>

            <!-- Status badge showing both User's Action and OVERALL application status -->
            <ng-template slot="txtStatus" let-value="data">
                <div class="flex flex-col items-start gap-1">
                    <span class="badge badge-outline-success text-xs">Me: APPROVED</span>
                    <span class="badge text-xs" [ngClass]="getStatusClass(value.txtStatus)">
                        App: {{ value.txtStatus || 'N/A' }}
                    </span>
                </div>
            </ng-template>

            <ng-template slot="txtAssetCode" let-value="data">
                <span class="badge badge-outline-info" *ngIf="value.txtAssetCode">{{ value.txtAssetCode }}</span>
                <span class="text-xs text-white-dark" *ngIf="!value.txtAssetCode">N/A</span>
            </ng-template>

            <ng-template slot="txtPrCode" let-value="data">
                <span class="badge badge-outline-success" *ngIf="value.txtPrCode">{{ value.txtPrCode }}</span>
                <span class="text-xs text-white-dark" *ngIf="!value.txtPrCode">N/A</span>
            </ng-template>

            <!-- Date when THIS user approved the application (from history JSON) -->
            <ng-template slot="myApprovalDate" let-value="data">
                <span *ngIf="value.myApprovalDate">{{ value.myApprovalDate | date: 'dd-MMM-yyyy HH:mm' }}</span>
                <span class="text-xs text-white-dark" *ngIf="!value.myApprovalDate">N/A</span>
            </ng-template>

            <ng-template slot="dteCreatedDate" let-value="data">
                {{ value.dteCreatedDate | date: 'dd-MMM-yyyy' }}
            </ng-template>

            <ng-template slot="actions" let-value="data">
                <div class="flex items-center justify-center">
                    <a (click)="viewApplication(value)" class="hover:text-info cursor-pointer" title="View Details">
                        <icon-eye class="h-5 w-5" />
                    </a>
                </div>
            </ng-template>

        </ng-datatable>
    </div>

</div>
