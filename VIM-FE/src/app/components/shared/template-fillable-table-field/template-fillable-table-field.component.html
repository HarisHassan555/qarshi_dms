<div class="table-editor-scroll">
    <table class="fillable-table" [class.inline-fillable-table]="inline">
        <tbody>
            <tr *ngIf="!tableFieldIndicatorsDismissed" class="table-index-row">
                <th class="fill-table-index fill-table-index-corner">
                    <button type="button" class="fill-table-index-remove" title="Remove row and column labels" (click)="dismissTableFieldIndicators($event)">×</button>
                </th>
                <th class="fill-table-index fill-table-col-label" *ngFor="let label of getTableIndicatorColumns()">{{ label }}</th>
            </tr>
            <tr *ngFor="let row of getTableRenderRows(); let rowIndex = index; trackBy: trackTableRow">
                <th *ngIf="!tableFieldIndicatorsDismissed" class="fill-table-index">{{ rowIndex + 1 }}</th>
                <td
                    *ngFor="let cell of row.cells; let columnIndex = index; trackBy: trackTableCell"
                    [attr.colspan]="cell.colspan"
                    [attr.rowspan]="cell.rowspan"
                    [attr.class]="cell.className"
                    [attr.style]="cell.style"
                    (click)="openStructureMenu(cell, $event)">
                    <input
                        *ngIf="cell.editable || cell.formula; else staticTableLabel"
                        type="text"
                        [class.table-formula-expression-input]="cell.formula && isTableFormulaEditing(cell.key)"
                        [ngModel]="tableCellEditorValue(cell)"
                        [disabled]="!editable"
                        (focus)="beginTableCellEdit(cell, $event)"
                        (blur)="endTableCellEdit(cell)"
                        (copy)="onTableCellCopy(cell, $event)"
                        (paste)="onTableCellPaste(cell, $event)"
                        (ngModelChange)="onTableCellInput(cell, $event)" />
                    <ng-template #staticTableLabel>
                        <span [innerHTML]="cell.html"></span>
                    </ng-template>
                    <div
                        class="fill-table-cell-menu"
                        *ngIf="isStructureMenuOpen(cell.key)"
                        [style.top.px]="structureMenu?.top"
                        [style.left.px]="structureMenu?.left"
                        (mousedown)="$event.preventDefault()"
                        (click)="$event.stopPropagation()">
                        <button type="button" (click)="addTableRow('above', rowIndex, $event)">Row above</button>
                        <button type="button" (click)="addTableRow('below', rowIndex, $event)">Row below</button>
                        <button type="button" (click)="addTableColumn('before', columnIndex, $event)">Column before</button>
                        <button type="button" (click)="addTableColumn('after', columnIndex, $event)">Column after</button>
                        <button type="button" class="is-danger" (click)="deleteTableRow(rowIndex, $event)" [disabled]="tableRowCount <= 1">Delete row</button>
                        <button type="button" class="is-danger" (click)="deleteTableColumn(columnIndex, $event)" [disabled]="tableColumnCount <= 1">Delete column</button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
