<div>
    <div class="panel border-[#e0e6ed] px-0 pb-1.5 dark:border-[#1b2e4b]">
        <div class="datatable invoice-table">
            <div class="mb-4.5 flex flex-col gap-5 px-5 md:flex-row md:items-center">
                <div class="flex items-center gap-2">
                    <button type="button" class="btn btn-danger gap-2" (click)="deleteRow()">
                        <icon-trash-lines />
                        Delete
                    </button>
                    <a  (click)="modal2.open()" class="btn btn-primary gap-2">
                        <icon-plus />
                        Add New
                    </a>
                    <!--routerLink="/apps/invoice/add"-->
                </div>
                <div class="ltr:ml-auto rtl:mr-auto">
                    <input [(ngModel)]="search" type="text" class="form-input" placeholder="Search..." />
                </div>
            </div>

            <ng-datatable
                #datatable
                [rows]="items"
                [columns]="cols"
                [hasCheckbox]="true"
                [sortable]="true"
                [search]="search"
                skin="whitespace-nowrap bh-table-hover"
                firstArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M13 19L7 12L13 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M16.9998 19L10.9998 12L16.9998 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                lastArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M11 19L17 12L11 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <path opacity="0.5" d="M6.99976 19L12.9998 12L6.99976 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg> '
                previousArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M15 5L9 12L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
                nextArrow='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 rtl:rotate-180"> <path d="M9 5L15 12L9 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> </svg>'
            >
                <ng-template slot="invoice" let-value="data">
                    <a routerLink="/apps/invoice/preview" class="font-semibold text-primary underline hover:no-underline">#{{ value.invoice }}</a>
                </ng-template>
                <ng-template slot="name" let-value="data">
                    <div class="flex items-center font-semibold">
                        <div class="w-max rounded-full bg-white-dark/30 p-0.5 ltr:mr-2 rtl:ml-2">
                            <img class="h-8 w-8 rounded-full object-cover" [src]="'/assets/images/profile-'+ value.id + '.jpeg'" />
                        </div>
                        {{ value.name }}
                    </div>
                </ng-template>
                <ng-template slot="amount" let-value="data">
                    <div class="font-semibold ltr:text-right rtl:text-left">${{ value.amount }}</div>
                </ng-template>
                <ng-template slot="status" let-value="data">
                    <span class="badge" [ngClass]="[value.status.toLowerCase() === 'paid' ? 'badge-outline-success' : 'badge-outline-danger']"
                    >{{ value.status }}</span
                    >
                </ng-template>
                <ng-template slot="actions" let-value="data">
                    <div class="flex items-center justify-center gap-4">
                        <a routerLink="/apps/invoice/edit" class="hover:text-info">
                            <icon-edit class="h-4.5 w-4.5" />
                        </a>
                        <a routerLink="/apps/invoice/preview" class="hover:text-primary">
                            <icon-eye />
                        </a>
                        <button type="button" class="hover:text-danger" (click)="deleteRow(value.id)">
                            <icon-trash-lines />
                        </button>
                    </div>
                </ng-template>
            </ng-datatable>
        </div>
    </div>
</div>


<div class="panel">
    <div class="mb-5 flex items-center justify-between">
        <h5 class="text-lg font-semibold dark:text-white-light">Vertically Centered</h5>
        <a class="font-semibold hover:text-gray-400 dark:text-gray-400 dark:hover:text-gray-600" href="javascript:;" (click)="toggleCode('code2')">
                        <span class="flex items-center">
                            <icon-code class="me-2" />
                            Code
                        </span>
        </a>
    </div>
    <div class="mb-5">

        <modal #modal2>
            <ng-template #modalHeader> <div>Modal Title</div> </ng-template>
            <ng-template #modalBody>

                <form class="space-y-5" [formGroup]="form4" (ngSubmit)="submitForm4()" novalidate>
                    <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
                        <div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['firstName'].invalid, 'has-success': !form4.controls['firstName'].invalid}">
                            <label for="customFname">First Name</label>
                            <input id="customFname" type="text" placeholder="Enter First Name" class="form-input" formControlName="firstName" />
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['firstName'].invalid">
                                <p class="mt-1 text-danger">Please fill the first name</p>
                            </ng-container>
                        </div>

                        <div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['lastName'].invalid, 'has-success': !form4.controls['lastName'].invalid}">
                            <label for="customLname">Last Name</label>
                            <input id="customLname" type="text" placeholder="Enter Last Name" class="form-input" formControlName="lastName" />
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['lastName'].invalid">
                                <p class="mt-1 text-danger">Please fill the last name</p>
                            </ng-container>
                        </div>

                        <div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['userName'].invalid, 'has-success': !form4.controls['userName'].invalid}">
                            <label for="customeEmail">Username</label>
                            <div class="flex">
                                <div class="flex items-center justify-center border border-[#e0e6ed] bg-[#eee] px-3 font-semibold ltr:rounded-l-md ltr:border-r-0 rtl:rounded-r-md rtl:border-l-0 dark:border-[#17263c] dark:bg-[#1b2e4b]">
                                    @
                                </div>
                                <input id="customeEmail" type="text" placeholder="Enter Username" class="form-input ltr:rounded-l-none rtl:rounded-r-none" formControlName="userName" />
                            </div>
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['userName'].invalid">
                                <p class="mt-1 text-danger">Please choose a userName</p>
                            </ng-container>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 gap-5 md:grid-cols-4">
                        <div class="md:col-span-2" [ngClass]="{'has-error': isSubmitForm4 && form4.controls['city'].invalid, 'has-success': !form4.controls['city'].invalid}">
                            <label for="customeCity">City</label>
                            <input id="customeCity" type="text" placeholder="Enter City" class="form-input" formControlName="city" />
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['city'].invalid">
                                <p class="mt-1 text-danger">Please provide a valid city</p>
                            </ng-container>
                        </div>

                        <div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['state'].invalid, 'has-success': !form4.controls['state'].invalid}">
                            <label for="customeState">State</label>
                            <input id="customeState" type="text" placeholder="Enter State" class="form-input" formControlName="state" />
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['state'].invalid">
                                <p class="mt-1 text-danger">Please provide a valid state</p>
                            </ng-container>
                        </div>

                        <div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['zip'].invalid, 'has-success': !form4.controls['zip'].invalid}">
                            <label for="customeZip">Zip</label>
                            <input id="customeZip" type="text" placeholder="Enter Zip" class="form-input" formControlName="zip" />
                            <ng-container *ngIf="isSubmitForm4 && form4.controls['zip'].invalid">
                                <p class="mt-1 text-danger">Please provide a valid zip</p>
                            </ng-container>
                        </div>
                    </div>

                    <!--<div [ngClass]="{'has-error': isSubmitForm4 && form4.controls['isTerms'].invalid, 'has-success': !form4.controls['isTerms'].valid}">
                        <label class="mt-1 inline-flex cursor-pointer">
                            <input type="checkbox" class="form-checkbox" formControlName="isTerms" />
                            <span class="text-white-dark">Agree to terms and conditions</span>
                        </label>
                        <ng-container *ngIf="isSubmitForm4 && form4.controls['isTerms'].invalid">
                            <p class="mt-1 text-danger">You must agree before submitting.</p>
                        </ng-container>
                    </div>-->

                    <button type="button" (click)="modal2.close()" class="btn btn-outline-danger">Discard</button>
                    <button type="submit" class="btn btn-primary !mt-6">Submit Form</button>

                </form>


            </ng-template>
           <!-- <ng-template #modalFooter>
                <button type="button" (click)="modal2.close()" class="btn btn-outline-danger">Discard</button>
                &lt;!&ndash;<button type="submit"  class="btn btn-primary ltr:ml-4 rtl:mr-4 ">Save</button>&ndash;&gt;
                <button type="submit" class="btn btn-primary !mt-6">Submit Form</button>
            </ng-template>-->
        </modal>
    </div>
    <ng-container *ngIf="codeArr.includes('code2')">
                    <pre>
                        <code [languages]="['xml','typescript']" highlight=""></code>
                    </pre>
    </ng-container>
</div>
