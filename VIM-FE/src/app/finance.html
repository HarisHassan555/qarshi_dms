<div class="panel p-0 overflow-hidden border-none shadow-none bg-transparent">
    <div class="relative min-h-[calc(100vh-180px)] overflow-hidden rounded-xl">
        <!-- Background Image -->
        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 hover:scale-105"
            style="background-image: url('assets/images/qarshi-factory.jpg.jpeg');"></div>
        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/40 to-black/60"></div>

        <!-- Welcome Message -->
        <div class="relative z-10 flex flex-col items-center justify-center min-h-[calc(100vh-180px)] text-center px-4">
            <h1 class="text-6xl font-extrabold text-white mb-4 tracking-tight animate__animated animate__fadeInDown">
                Welcome, {{ username || 'User' }}
            </h1>
            <p class="text-xl text-white/90 max-w-2xl mx-auto animate__animated animate__fadeInUp">
               Qarshi Workflow Management System
            </p>
            <div class="mt-8 animate__animated animate__fadeInUp animate__delay-1s">
                <div class="h-1 w-24 bg-primary mx-auto rounded-full"></div>
            </div>
        </div>
    </div>
</div>
