<div class="font-[sans-serif] relative overflow-hidden">
    <div aria-hidden="true" style="position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1;"></div>

    <div class="min-h-screen flex flex-col items-center justify-center py-6 px-4 relative" style="z-index: 2;">
        <div class="max-w-md w-full">
            <a routerLink="/auth/signin"><img src="assets/images/qarshi-logo.png" alt="logo" class="w-40 mb-8 mx-auto block" /></a>

            <div class="p-8 rounded-2xl bg-white/90 backdrop-blur-sm shadow-xl">
                <h2 class="text-gray-800 text-center text-2xl font-bold">Forgot Password</h2>
                <p class="text-center text-xs text-gray-500 mt-1" *ngIf="step === 'email'">Enter your registered email. We will queue an OTP email right away.</p>
                <p class="text-center text-xs text-gray-500 mt-1" *ngIf="step === 'otp'">Enter the 6-digit code sent to {{ maskedEmail || 'your email' }}.</p>
                <p class="text-center text-xs text-gray-500 mt-1" *ngIf="step === 'password'">Choose a new password for your account.</p>

                <form *ngIf="step === 'email'" class="mt-8 space-y-4" [formGroup]="emailForm" (ngSubmit)="submitEmail()">
                    <div>
                        <label class="text-gray-800 text-sm mb-2 block">Email</label>
                        <input
                            formControlName="email"
                            type="email"
                            class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600"
                            placeholder="you@company.com"
                            autocomplete="email" />
                        <div *ngIf="emailForm.controls['email'].touched && emailForm.controls['email'].invalid" class="text-red-500 text-sm mt-1">
                            Enter a valid email address.
                        </div>
                    </div>
                    <button type="submit" class="w-full rounded-md bg-red-500 px-3 py-3 text-sm font-semibold text-white hover:bg-red-400" [disabled]="isSubmitting">
                        {{ isSubmitting ? 'Sending...' : 'Send OTP' }}
                    </button>
                </form>

                <form *ngIf="step === 'otp'" class="mt-8 space-y-4" [formGroup]="otpForm" (ngSubmit)="submitOtp()">
                    <div>
                        <label class="text-gray-800 text-sm mb-2 block">OTP</label>
                        <input
                            formControlName="otp"
                            type="text"
                            maxlength="6"
                            inputmode="numeric"
                            class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600 tracking-widest text-center"
                            placeholder="000000"
                            autocomplete="one-time-code" />
                        <div *ngIf="otpForm.controls['otp'].touched && otpForm.controls['otp'].invalid" class="text-red-500 text-sm mt-1">
                            Enter the 6-digit OTP.
                        </div>
                    </div>
                    <button type="submit" class="w-full rounded-md bg-red-500 px-3 py-3 text-sm font-semibold text-white hover:bg-red-400" [disabled]="isSubmitting">
                        {{ isSubmitting ? 'Verifying...' : 'Verify OTP' }}
                    </button>
                    <button type="button" class="w-full text-sm text-blue-600 font-semibold" (click)="step = 'email'">Use a different email</button>
                </form>

                <form *ngIf="step === 'password'" class="mt-8 space-y-4" [formGroup]="passwordForm" (ngSubmit)="submitNewPassword()">
                    <div>
                        <label class="text-gray-800 text-sm mb-2 block">New password</label>
                        <input
                            formControlName="newPassword"
                            type="password"
                            class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600"
                            placeholder="New password"
                            autocomplete="new-password" />
                    </div>
                    <div>
                        <label class="text-gray-800 text-sm mb-2 block">Confirm password</label>
                        <input
                            formControlName="confirmPassword"
                            type="password"
                            class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600"
                            placeholder="Confirm password"
                            autocomplete="new-password" />
                    </div>
                    <button type="submit" class="w-full rounded-md bg-red-500 px-3 py-3 text-sm font-semibold text-white hover:bg-red-400" [disabled]="isSubmitting">
                        {{ isSubmitting ? 'Updating...' : 'Change password' }}
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <button type="button" class="text-sm text-blue-600 font-semibold hover:underline" (click)="goToSignIn()">Back to sign in</button>
                </div>
            </div>
        </div>
    </div>
</div>
