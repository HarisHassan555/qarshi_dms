<div class="font-[sans-serif] relative overflow-hidden">
    <!-- YouTube background video -->
    <div aria-hidden="true"
         style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: 0; pointer-events: none;">
        <iframe
            src="https://www.youtube.com/embed/n-7ibajRLZU?autoplay=1&mute=1&loop=1&playlist=n-7ibajRLZU&controls=0&showinfo=0&modestbranding=1&disablekb=1&playsinline=1&rel=0&iv_load_policy=3&fs=0"
            title="Background video"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen
            style="position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; transform: translate(-50%, -50%); pointer-events: none; border: 0;">
        </iframe>
    </div>
    <!-- Dim overlay to keep the form readable -->
    <div aria-hidden="true"
         style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); z-index: 1; pointer-events: none;">
    </div>

    <div class="min-h-screen flex flex-col items-center justify-center py-6 px-4 relative" style="z-index: 2;">
      <div class="max-w-md w-full">
        <a href="javascript:void(0)"><img
          src="assets/images/qarshi-logo.png" alt="logo" class='w-40 mb-8 mx-auto block' />
        </a>

        <div class="p-8 rounded-2xl bg-white/90 backdrop-blur-sm shadow-xl">
          <h2 class="text-gray-800 text-center text-2xl font-bold">Sign In</h2>
          <p class="text-center text-xs font-semibold uppercase tracking-wide text-gray-500 mt-1">Qarshi Workflow Management System</p>
          <form class="mt-8 space-y-4" [formGroup]="signinForm" (submit)="onSignin()">
            <div>
              <label class="text-gray-800 text-sm mb-2 block">Username</label>
              <div class="relative flex items-center">
                <input formControlName="username" name="username" type="text" required class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600" placeholder="Enter Username" />
                <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-4 h-4 absolute right-4" viewBox="0 0 24 24">
                  <circle cx="10" cy="7" r="6" data-original="#000000"></circle>
                  <path d="M14 15H6a5 5 0 0 0-5 5 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 5 5 0 0 0-5-5zm8-4h-2.59l.3-.29a1 1 0 0 0-1.42-1.42l-2 2a1 1 0 0 0 0 1.42l2 2a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.42l-.3-.29H22a1 1 0 0 0 0-2z" data-original="#000000"></path>
                </svg>
              </div>
              <div *ngIf="isSubmitted && signinForm.controls['username'].invalid" class="text-red-500 p-1">
                Username is required
              </div>
            </div>

            <div>
              <label class="text-gray-800 text-sm mb-2 block">Password</label>
              <div class="relative flex items-center">
                <input formControlName="password" name="password" [type]="showPassword ? 'text' : 'password'" required class="w-full text-gray-800 text-sm border border-gray-300 px-4 py-3 rounded-md outline-blue-600 pr-10" placeholder="Enter Password" />
                <button
                  type="button"
                  class="absolute right-4 text-gray-400 hover:text-gray-600"
                  (click)="togglePasswordVisibility()"
                  aria-label="Toggle password visibility"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="#bbb" stroke="#bbb" class="w-4 h-4" viewBox="0 0 128 128">
                    <path d="M64 104C22.127 104 1.367 67.496.504 65.943a4 4 0 0 1 0-3.887C1.367 60.504 22.127 24 64 24s62.633 36.504 63.496 38.057a4 4 0 0 1 0 3.887C126.633 67.496 105.873 104 64 104zM8.707 63.994C13.465 71.205 32.146 96 64 96c31.955 0 50.553-24.775 55.293-31.994C114.535 56.795 95.854 32 64 32 32.045 32 13.447 56.775 8.707 63.994zM64 88c-13.234 0-24-10.766-24-24s10.766-24 24-24 24 10.766 24 24-10.766 24-24 24zm0-40c-8.822 0-16 7.178-16 16s7.178 16 16 16 16-7.178 16-16-7.178-16-16-16z" data-original="#000000"></path>
                  </svg>
                </button>
              </div>
              <div *ngIf="isSubmitted && signinForm.controls['password'].invalid" class="text-red-500 p-1">
                Password is required
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4">
              <!-- <div class="flex items-center">
                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 shrink-0 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
                <label for="remember-me" class="ml-3 block text-sm text-gray-800">
                  Remember me
                </label>
              </div> -->
              <!-- <div class="text-sm">
                <a href="jajvascript:void(0);" class="text-blue-600 hover:underline font-semibold">
                  Forgot your password?
                </a>
              </div> -->
            </div>

            <div class="!mt-8">
              <button type="submit" class="flex w-full justify-center items-center gap-2 rounded-md bg-red-500 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
                {{isSuccess ? 'Redirecting...' : 'Sign In'}} <span *ngIf="isShowLoader" class="animate-spin border-2 border-white border-l-transparent rounded-full w-5 h-5 ltr:mr-4 rtl:ml-4 inline-block align-middle"></span>
              </button>
            </div>
            <div *ngIf="isError" class="text-red-500 p-1 text-center">
              Username or Password is incorrect
            </div>
            <!-- <p class="text-gray-800 text-sm !mt-8 text-center">Don't have an account? <a href="javascript:void(0);" class="text-blue-600 hover:underline ml-1 whitespace-nowrap font-semibold">Register here</a></p> -->
          </form>
        </div>
      </div>
    </div>
  </div>
<div *ngIf="false" class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <img class="mx-auto h-20 w-auto" src="assets/images/qarshi-logo.png" alt="logo">
      <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight to-blue-500">Sign in to continue</h2>
    </div>
  
    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form class="space-y-6" action="#" method="POST">
        <div>
          <label for="email" class="block text-sm font-medium leading-6 text-balance">Username</label>
          <div class="mt-2">
            <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border-0 bg-white/5 py-1.5 text-cyan-600 shadow-sm ring-1 ring-inset ring-red-500 focus:ring-2 focus:ring-inset focus:ring-balck sm:text-sm sm:leading-6">
          </div>
        </div>
  
        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm font-medium leading-6 text-black">Password</label>
            <!-- <div class="text-sm">
              <a href="#" class="font-semibold text-red-500 hover:text-red-400">Forgot password?</a>
            </div> -->
          </div>
          <div class="mt-2">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md border-0 bg-white/5 py-1.5 text-white shadow-sm ring-1 ring-inset ring-red-500 focus:ring-2 focus:ring-inset focus:ring-black sm:text-sm sm:leading-6">
          </div>
        </div>
  
        <div>
          <button type="submit" class="flex w-full justify-center rounded-md bg-red-500 px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">Sign in</button>
        </div>
      </form>
  
      <!-- <p class="mt-10 text-center text-sm text-gray-400">
        Not a member?
        <a href="#" class="font-semibold leading-6 text-red-500 hover:text-red-400">Start a 7 days free trial</a>
      </p> -->
    </div>
  </div>
